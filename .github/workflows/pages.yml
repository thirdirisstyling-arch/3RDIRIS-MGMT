name: Deploy to GitHub Pages

on:
  push:
    branches: [ccr-826cfc21-ar7nwz, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # stamp this deploy's version onto the page and its files, so browsers never mix an
      # old script with a new page, and open copies of the app can tell they're out of date
      - name: Stamp the version
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__V__/$V/g" index.html
          echo "$V" > version.txt
      # the app is static, so the repo root is the site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
